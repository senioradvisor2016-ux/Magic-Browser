<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atlas Agent - DevTools</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      overflow: hidden;
    }
    
    .devtools-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
    }
    
    .toolbar-btn {
      background: #0e639c;
      border: none;
      border-radius: 3px;
      color: white;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 11px;
    }
    
    .toolbar-btn:hover {
      background: #1177bb;
    }
    
    .toolbar-btn.danger {
      background: #c53030;
    }
    
    .toolbar-btn.danger:hover {
      background: #e53e3e;
    }
    
    .toolbar-spacer {
      flex: 1;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a4a4a;
    }
    
    .status-dot.active {
      background: #4caf50;
    }
    
    .status-dot.running {
      background: #ff9800;
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Tabs */
    .tabs {
      display: flex;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
    }
    
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: #969696;
      font-size: 11px;
    }
    
    .tab:hover {
      color: #d4d4d4;
    }
    
    .tab.active {
      color: #d4d4d4;
      border-bottom-color: #0e639c;
    }
    
    /* Main content */
    .content {
      flex: 1;
      overflow: hidden;
      display: flex;
    }
    
    .panel {
      display: none;
      flex: 1;
      overflow: auto;
      padding: 12px;
    }
    
    .panel.active {
      display: block;
    }
    
    /* State panel */
    .state-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .state-card {
      background: #2d2d2d;
      border-radius: 4px;
      padding: 12px;
    }
    
    .state-card h3 {
      font-size: 11px;
      color: #969696;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    
    .state-value {
      font-size: 18px;
      font-weight: bold;
      color: #4fc3f7;
    }
    
    /* DOM panel */
    .dom-tree {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    
    .dom-element {
      padding-left: 16px;
    }
    
    .dom-tag {
      color: #569cd6;
    }
    
    .dom-attr {
      color: #9cdcfe;
    }
    
    .dom-value {
      color: #ce9178;
    }
    
    .dom-interactive {
      background: rgba(78, 201, 176, 0.1);
      border-left: 2px solid #4ec9b0;
    }
    
    /* Actions panel */
    .action-input {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .action-input input,
    .action-input select {
      flex: 1;
      padding: 6px 8px;
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 3px;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 11px;
    }
    
    .action-log {
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 8px;
      height: 200px;
      overflow-y: auto;
      font-size: 11px;
    }
    
    .action-entry {
      padding: 4px 0;
      border-bottom: 1px solid #2d2d2d;
    }
    
    .action-entry.success {
      color: #4caf50;
    }
    
    .action-entry.error {
      color: #f44336;
    }
    
    .action-entry .time {
      color: #666;
      margin-right: 8px;
    }
    
    /* Metrics panel */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .metric-card {
      background: #2d2d2d;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
    }
    
    .metric-value {
      font-size: 24px;
      font-weight: bold;
      color: #4fc3f7;
    }
    
    .metric-label {
      font-size: 10px;
      color: #969696;
      margin-top: 4px;
    }
    
    /* Prompt panel */
    .prompt-editor {
      width: 100%;
      height: 300px;
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 12px;
      color: #d4d4d4;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      resize: vertical;
    }
    
    .prompt-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="devtools-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <button class="toolbar-btn" id="refresh-btn">↻ Refresh</button>
      <button class="toolbar-btn" id="extract-btn">Extract DOM</button>
      <button class="toolbar-btn" id="screenshot-btn">Screenshot</button>
      <div class="toolbar-spacer"></div>
      <div class="status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Idle</span>
      </div>
    </div>
    
    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-panel="state">State</div>
      <div class="tab" data-panel="dom">DOM</div>
      <div class="tab" data-panel="actions">Actions</div>
      <div class="tab" data-panel="metrics">Metrics</div>
      <div class="tab" data-panel="prompts">Prompts</div>
    </div>
    
    <!-- Content -->
    <div class="content">
      <!-- State Panel -->
      <div class="panel active" id="state-panel">
        <div class="state-grid">
          <div class="state-card">
            <h3>Provider</h3>
            <div class="state-value" id="state-provider">Anthropic</div>
          </div>
          <div class="state-card">
            <h3>Model</h3>
            <div class="state-value" id="state-model">Claude Sonnet 4</div>
          </div>
          <div class="state-card">
            <h3>Max Steps</h3>
            <div class="state-value" id="state-maxsteps">50</div>
          </div>
          <div class="state-card">
            <h3>Vision</h3>
            <div class="state-value" id="state-vision">Enabled</div>
          </div>
          <div class="state-card">
            <h3>Active Tasks</h3>
            <div class="state-value" id="state-tasks">0</div>
          </div>
          <div class="state-card">
            <h3>API Key</h3>
            <div class="state-value" id="state-apikey">Configured</div>
          </div>
        </div>
      </div>
      
      <!-- DOM Panel -->
      <div class="panel" id="dom-panel">
        <div class="dom-tree" id="dom-tree">
          <p style="color: #666;">Click "Extract DOM" to view page structure</p>
        </div>
      </div>
      
      <!-- Actions Panel -->
      <div class="panel" id="actions-panel">
        <div class="action-input">
          <select id="action-type">
            <option value="click">Click</option>
            <option value="type">Type</option>
            <option value="scroll">Scroll</option>
            <option value="hover">Hover</option>
          </select>
          <input type="text" id="action-selector" placeholder="CSS Selector">
          <input type="text" id="action-value" placeholder="Value (for type)">
          <button class="toolbar-btn" id="test-action-btn">Test</button>
        </div>
        
        <h3 style="margin: 16px 0 8px; color: #969696; font-size: 11px;">Action Log</h3>
        <div class="action-log" id="action-log">
          <!-- Action entries will be added here -->
        </div>
      </div>
      
      <!-- Metrics Panel -->
      <div class="panel" id="metrics-panel">
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-value" id="metric-tasks">0</div>
            <div class="metric-label">Total Tasks</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="metric-success">0</div>
            <div class="metric-label">Successful</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="metric-steps">0</div>
            <div class="metric-label">Total Steps</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="metric-llm">0</div>
            <div class="metric-label">LLM Calls</div>
          </div>
        </div>
        
        <button class="toolbar-btn danger" id="reset-metrics-btn">Reset Metrics</button>
      </div>
      
      <!-- Prompts Panel -->
      <div class="panel" id="prompts-panel">
        <h3 style="margin-bottom: 8px; color: #969696; font-size: 11px;">System Prompt</h3>
        <textarea class="prompt-editor" id="prompt-editor"></textarea>
        <div class="prompt-actions">
          <button class="toolbar-btn" id="save-prompt-btn">Save</button>
          <button class="toolbar-btn" id="reset-prompt-btn">Reset to Default</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.panel + '-panel').classList.add('active');
      });
    });
    
    // DevTools API communication would happen here
    // In real implementation, this would use chrome.devtools.* APIs
    
    // Placeholder for action testing
    document.getElementById('test-action-btn').addEventListener('click', () => {
      const type = document.getElementById('action-type').value;
      const selector = document.getElementById('action-selector').value;
      const value = document.getElementById('action-value').value;
      
      const time = new Date().toLocaleTimeString();
      const log = document.getElementById('action-log');
      const entry = document.createElement('div');
      entry.className = 'action-entry';
      entry.innerHTML = `<span class="time">${time}</span> ${type}: ${selector}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    });
  </script>
</body>
</html>
