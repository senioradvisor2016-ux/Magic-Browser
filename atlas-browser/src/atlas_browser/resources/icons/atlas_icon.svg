<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the globe -->
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C4DFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the agent indicator -->
    <linearGradient id="agentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#globeGradient)" filter="url(#shadow)"/>
  
  <!-- Globe lines - latitude -->
  <ellipse cx="64" cy="64" rx="48" ry="16" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  <ellipse cx="64" cy="64" rx="48" ry="32" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  <ellipse cx="64" cy="64" rx="48" ry="48" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  
  <!-- Globe lines - longitude -->
  <ellipse cx="64" cy="64" rx="16" ry="48" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  <ellipse cx="64" cy="64" rx="32" ry="48" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="64" y1="16" x2="64" y2="112" stroke="white" stroke-width="2" opacity="0.4"/>
  
  <!-- AI Agent indicator (bottom right) -->
  <circle cx="98" cy="98" r="22" fill="url(#agentGradient)" stroke="white" stroke-width="3"/>
  
  <!-- Robot face on agent indicator -->
  <rect x="88" y="90" width="20" height="14" rx="3" fill="white"/>
  <circle cx="93" cy="96" r="2" fill="#2E7D32"/>
  <circle cx="103" cy="96" r="2" fill="#2E7D32"/>
  <rect x="91" y="100" width="14" height="2" rx="1" fill="#2E7D32"/>
  
  <!-- Antenna -->
  <line x1="98" y1="83" x2="98" y2="78" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="98" cy="76" r="2" fill="white"/>
</svg>
